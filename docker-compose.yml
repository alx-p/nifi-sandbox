services:

  nifi:
    image: apache/nifi:2.7.2
    container_name: nifi-sandbox-server
    environment:
      #- NIFI_JVM_MINMEM=2G
      #- NIFI_JVM_MAXMEM=2G
      #- NIFI_LOG_LEVEL=INFO  
      - NIFI_WEB_HTTP_PORT=8080  
    volumes:
      - ./nifi_data:/opt/nifi-nar-bundles
      - ./nifi-flows:/opt/nifi-flows
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:13.22-bookworm
    container_name: nifi-sandbox-pg
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-default_password} # либо задаём в .env файле
      POSTGRES_DB: nifi_db
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data

volumes:
  nifi_data:
  pg_data:        